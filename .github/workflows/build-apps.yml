name: Build Mission OS Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx electron-builder --win nsis portable --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: mission-learning-os-windows
          path: dist/*.exe
          if-no-files-found: error

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Install Gradle
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-9.5.1-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo /opt/gradle-9.5.1/bin >> "$GITHUB_PATH"
      - name: Package exact app with final UI layer
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android/app/src/main/assets
          mkdir -p android/app/src/main/assets
          cp index.html /tmp/mission-index.html
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/mission-index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="src/ui-final-fix-v4.js?v=4.0"></script>'
          s=s.replace('</body>',tag+'</body>')
          p.write_text(s,encoding='utf-8')
          PY
          cp /tmp/mission-index.html android/app/src/main/assets/index.html
          cp -R src android/app/src/main/assets/src
          test -f android/app/src/main/assets/src/ui-final-fix-v4.js
          test -f android/app/src/main/assets/src/execution-engine.js
          test -f android/app/src/main/assets/src/responsive-safe-area.js
      - name: Build standalone Android APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon
      - name: Verify APK and final UI layer
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          rm -rf /tmp/mission-apk-check
          mkdir -p /tmp/mission-apk-check
          unzip -q "$APK" -d /tmp/mission-apk-check
          test -f /tmp/mission-apk-check/assets/src/ui-final-fix-v4.js
          test -f /tmp/mission-apk-check/assets/src/execution-engine.js
          test -f /tmp/mission-apk-check/assets/index.html
          grep -Fq 'src/ui-final-fix-v4.js?v=4.0' /tmp/mission-apk-check/assets/index.html
          echo "Verified APK, final UI v4, and execution engine."
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk mission-learning-os-final-web.apk
      - uses: actions/upload-artifact@v4
        with:
          name: mission-learning-os-android-final-web
          path: mission-learning-os-final-web.apk
          if-no-files-found: error
