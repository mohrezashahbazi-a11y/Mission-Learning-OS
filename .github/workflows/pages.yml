name: Deploy Mission OS to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Inject authoritative runtime controllers
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          import re
          for name in ['runtime','review-runtime','application-readiness','application-core','application-dependencies','timeline','deadline-sync','director-engine','next-action','execution-policy']:
              s = re.sub(rf'<script src="src/{name}\\.js(?:\\?v=[^"]+)?"></script>', '', s)
          tags = [
              '<script src="src/application-core.js?v=0.1"></script>',
              '<script src="src/application-dependencies.js?v=0.1"></script>',
              '<script src="src/application-readiness.js?v=0.2"></script>',
              '<script src="src/timeline.js?v=0.2"></script>',
              '<script src="src/deadline-sync.js?v=0.1"></script>',
              '<script src="src/runtime.js?v=0.8"></script>',
              '<script src="src/director-engine.js?v=0.2"></script>',
              '<script src="src/next-action.js?v=0.1"></script>',
              '<script src="src/execution-policy.js?v=0.1"></script>'
          ]
          for tag in tags:
              s = s.replace('</body>', tag + '</body>')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
