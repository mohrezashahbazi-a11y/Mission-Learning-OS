name: Deploy Mission OS to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  EXECUTION_TIMER_VERSION: '1.3'
  EXECUTION_GUIDE_VERSION: '0.7'
  EXECUTION_GUIDE_HELP_VERSION: '0.1'
  EXECUTION_ENGINE_VERSION: '1.1'
  CREAM_BLACK_THEME_VERSION: '1.0'
  LUXURY_THEME_VERSION: '1.3'
  NEXT_ACTION_VERSION: '0.4'

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Inject authoritative runtime controllers
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          names = ['runtime','review-runtime','application-readiness','application-core','application-dependencies','timeline','deadline-sync','director-engine','next-action','execution-policy','execution-history','execution-timer-bridge','execution-engine','ui-cleanup','mentoring-manager','iran-clock','rest-day','date-display','execution-guide','execution-guide-help','cream-theme','luxury-theme']
          for name in names:
              s = re.sub(rf'<script src="src/{name}\\.js(?:\\?v=[^"]+)?"></script>', '', s)
          tags = [
              '<script src="src/application-core.js?v=0.1"></script>',
              '<script src="src/application-dependencies.js?v=0.1"></script>',
              '<script src="src/application-readiness.js?v=0.2"></script>',
              '<script src="src/timeline.js?v=0.2"></script>',
              '<script src="src/iran-clock.js?v=0.2"></script>',
              '<script src="src/date-display.js?v=0.2"></script>',
              '<script src="src/deadline-sync.js?v=0.4"></script>',
              '<script src="src/runtime.js?v=0.9"></script>',
              '<script src="src/director-engine.js?v=0.2"></script>',
              '<script src="src/next-action.js?v=0.4"></script>',
              '<script src="src/execution-policy.js?v=0.1"></script>',
              '<script src="src/execution-history.js?v=1.3"></script>',
              '<script src="src/execution-timer-bridge.js?v=1.1"></script>',
              '<script src="src/execution-engine.js?v=1.1"></script>',
              '<script src="src/execution-guide.js?v=0.7"></script>',
              '<script src="src/execution-guide-help.js?v=0.1"></script>',
              '<script src="src/ui-cleanup.js?v=0.1"></script>',
              '<script src="src/mentoring-manager.js?v=0.3"></script>',
              '<script src="src/rest-day.js?v=0.1"></script>',
              '<script src="src/cream-theme.js?v=1.0"></script>',
              '<script src="src/luxury-theme.js?v=1.3"></script>'
          ]
          for tag in tags:
              s = s.replace('</body>', tag + '</body>')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
