name: Deploy Mission OS to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  TIME_AWARE_GREETING_VERSION: '1.3'
  MASTERY_ENGINE_VERSION: '1.0'
  MASTERY_UI_VERSION: '1.0'
  GOOGLE_SYNC_VERSION: '1.7'
  CLOUD_FOUNDATION_VERSION: '1.2'
  ANALYTICS_ENGINE_VERSION: '1.0'
  ANALYTICS_UI_VERSION: '1.1'
  EXECUTION_GUIDE_VERSION: '0.8'

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Inject authoritative runtime controllers
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          names = ['runtime','review-runtime','application-readiness','application-core','application-dependencies','timeline','deadline-sync','director-engine','next-action','execution-policy','execution-history','execution-timer-bridge','execution-engine','execution-control-fix','adaptive-execution','priority-display','daily-state','daily-log-editor','ui-cleanup','mentoring-manager','iran-clock','rest-day','date-display','execution-guide','execution-guide-help','execution-guide-v2','cream-theme','luxury-theme','supabase-config','supabase-client','time-aware-greeting','mastery-engine','mastery-ui','mastery-evidence-adapter','mastery-adaptive-bridge','google-drive-auth','google-drive-sync','google-drive-sync-ui','cloud-foundation','analytics-engine','analytics-ui']
          for name in names:
              s = re.sub(rf'<script src="src/{name}\\.js(?:\\?v=[^"]+)?"></script>', '', s)
          tags = [
              '<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>',
              '<script src="src/application-core.js?v=0.1"></script>',
              '<script src="src/application-dependencies.js?v=0.1"></script>',
              '<script src="src/application-readiness.js?v=0.2"></script>',
              '<script src="src/timeline.js?v=0.2"></script>',
              '<script src="src/iran-clock.js?v=0.2"></script>',
              '<script src="src/date-display.js?v=0.2"></script>',
              '<script src="src/deadline-sync.js?v=0.4"></script>',
              '<script src="src/runtime.js?v=0.9"></script>',
              '<script src="src/director-engine.js?v=0.2"></script>',
              '<script src="src/next-action.js?v=0.4"></script>',
              '<script src="src/execution-policy.js?v=0.1"></script>',
              '<script src="src/execution-history.js?v=1.4"></script>',
              '<script src="src/execution-timer-bridge.js?v=1.1"></script>',
              '<script src="src/execution-engine.js?v=2.1"></script>',
              '<script src="src/execution-guide.js?v=0.7"></script>',
              '<script src="src/execution-guide-help.js?v=0.1"></script>',
              '<script src="src/execution-guide-v2.js?v=0.8"></script>',
              '<script src="src/adaptive-execution.js?v=1.0"></script>',
              '<script src="src/priority-display.js?v=1.0"></script>',
              '<script src="src/daily-state.js?v=1.0"></script>',
              '<script src="src/daily-log-editor.js?v=1.0"></script>',
              '<script src="src/ui-cleanup.js?v=0.1"></script>',
              '<script src="src/mentoring-manager.js?v=0.3"></script>',
              '<script src="src/rest-day.js?v=0.1"></script>',
              '<script src="src/supabase-config.js?v=1.0"></script>',
              '<script src="src/supabase-client.js?v=1.0"></script>',
              '<script src="src/cream-theme.js?v=1.0"></script>',
              '<script src="src/luxury-theme.js?v=1.3"></script>',
              '<script src="src/time-aware-greeting.js?v=1.3"></script>',
              '<script src="src/mastery-engine.js?v=1.0"></script>',
              '<script src="src/mastery-ui.js?v=1.0"></script>',
              '<script src="src/mastery-evidence-adapter.js?v=1.0"></script>',
              '<script src="src/mastery-adaptive-bridge.js?v=1.0"></script>',
              '<script src="src/google-drive-sync.js?v=1.7"></script>',
              '<script src="src/google-drive-sync-ui.js?v=1.0"></script>',
              '<script src="src/cloud-foundation.js?v=1.2"></script>',
              '<script src="src/analytics-engine.js?v=1.0"></script>',
              '<script src="src/analytics-ui.js?v=1.1"></script>'
          ]
          for tag in tags:
              s = s.replace('</body>', tag + '</body>')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
