name: Build Standalone Android APK

on:
  workflow_dispatch:
  push:
    branches: [standalone-android]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare bundled web app
        run: |
          rm -rf android/app/src/main/assets
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html
          cp -R src android/app/src/main/assets/src

      - name: Build release APK
        working-directory: android
        shell: bash
        run: |
          set +e
          gradle assembleRelease --no-daemon 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          exit $status

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mission-learning-os-standalone-apk
          path: android/app/build/outputs/apk/release/*.apk

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mission-learning-os-build-log
          path: android/build.log
